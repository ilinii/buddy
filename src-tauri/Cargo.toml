[package]
name = "buddy"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Local-first meeting workspace"
authors = ["Buddy contributors"]
edition = "2021"
rust-version = "1.90"

[features]
# Compile-check the Rust ABI on Windows; this does not link Apple frameworks.
check-macos-bridge = []
check-ios-bridge = []

[lib]
name = "buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
atomic-write-file = "0.3.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "fs", "io-util", "rt", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

cpal = "0.18.2"
whisper-rs = "0.16.0"
rubato = "0.16.2"
hound = "3.5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.27.0"
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
